<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>오마고치 인증 코드</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;">
<!-- 실제 인증 메일 발송에 사용하는 단일 HTML 원본이다. -->
<!-- Outlook·Gmail 호환을 위해 table 레이아웃과 inline style을 유지한다. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background:#ffffff;margin:0;padding:0;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
             style="max-width:420px;background:#fafafa;border:1px solid #e6e6e6;border-radius:24px;">
        <tr>
          <td align="center" style="padding:44px 24px 40px 24px;">
            <img src="../../static/img/default.png" th:if="${mascotAvailable}"
                 th:src="|cid:${mascotContentId}|" width="120" height="120" alt="오마고치"
                 style="display:block;border:0;outline:none;text-decoration:none;-ms-interpolation-mode:nearest-neighbor;image-rendering:pixelated;">
            <div style="height:32px;line-height:32px;font-size:0;">&nbsp;</div>
            <div style="font-size:26px;line-height:1.3;font-weight:700;color:#111111;letter-spacing:-0.5px;">
              인증 코드
            </div>
            <div style="height:34px;line-height:34px;font-size:0;">&nbsp;</div>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
              <tr>
                <th:block th:each="character, status : ${codeCharacters}">
                  <td align="center" valign="middle"
                      style="width:46px;height:66px;background:#eeeef0;border-radius:10px;font-size:26px;font-weight:700;color:#111111;text-align:center;"
                      th:text="${character}">4</td>
                  <td th:if="${!status.last}" style="width:10px;font-size:0;line-height:0;">&nbsp;</td>
                </th:block>
              </tr>
            </table>
            <div style="height:36px;line-height:36px;font-size:0;">&nbsp;</div>
            <div style="font-size:20px;line-height:1.4;font-weight:700;color:#111111;letter-spacing:-0.3px;">
              <span th:text="${validityMinutes}">5</span>분 안에 입력하세요
            </div>
          </td>
        </tr>
      </table>
      <div style="max-width:420px;padding:20px 8px 0 8px;font-size:12px;line-height:1.6;color:#9a9a9a;text-align:center;">
        본인이 요청하지 않았다면 이 메일을 무시해 주세요.
      </div>
    </td>
  </tr>
</table>
</body>
</html>
