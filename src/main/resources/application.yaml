server:
  port: ${SERVER_PORT}
  # 배포 관리 경계에서 실제 연결 주소 사용, 전달 Header에 의한 주소 변환 제외
  forward-headers-strategy: none
  shutdown: graceful

spring:
  lifecycle:
    # 진행 중 요청의 종료 대기 상한, Docker 종료 대기는 이보다 길게 설정
    timeout-per-shutdown-phase: 30s
  application:
    name: identity-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: identity_service
    schemas:
      - identity_service
    create-schemas: true
    clean-disabled: true
    validate-on-migrate: true
    postgresql:
      # 비트랜잭션 concurrent index migration을 자체 schema lock으로 막지 않는다.
      transactional-lock: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: identity_service

eureka:
  client:
    enabled: ${EUREKA_ENABLED}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
    healthcheck:
      enabled: true
    serviceUrl:
      defaultZone: ${EUREKA_URL}

  instance:
    # 같은 슬롯의 재기동과 이전 등록 구분, 초기화 완료 전 UP 등록 방지
    instance-id: ${spring.application.name}:${random.uuid}
    initial-status: STARTING
    prefer-ip-address: true

management:
  # Trace 전파 유지, Collector 전송은 운영 환경에서만 활성화
  opentelemetry:
    tracing:
      export:
        max-queue-size: 1024
        max-batch-size: 128
        schedule-delay: 5s
        timeout: 3s
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          connect-timeout: 1s
          timeout: 2s
      limits:
        max-attributes: 32
        max-attribute-value-length: 256
        max-events: 8
  metrics:
    distribution:
      # p95 집계용 고정 Bucket, Route·상태 조합별 Series 증가량 제한
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s,30s,60s
  tracing:
    export:
      otlp:
        enabled: false
    sampling:
      probability: 1.0
    propagation:
      type: w3c
    baggage:
      enabled: false
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
          - info
          - registry
          - serviceregistry
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# 쿼리 실행 시간·종류만 수집, SQL 본문·바인딩 값·추가 SQL 로그 제외
jdbc:
  includes: QUERY
  datasource-proxy:
    include-parameter-values: false
    query:
      enable-logging: false
    slow-query:
      enable-logging: false
  resultset-operations:
    enabled: false
  opentelemetry:
    attributes:
      overrides:
        "[db.query.text]": ""

account:
  recovery:
    # 복구 정책 도입 전에 탈퇴한 계정의 유예 시작 기준 시각
    policy-effective-at: ${ACCOUNT_RECOVERY_POLICY_EFFECTIVE_AT:2026-09-03T00:00:00Z}

auth:
  login-protection:
    maximum-failed-attempts: ${LOGIN_MAXIMUM_FAILED_ATTEMPTS:5}
    lock-duration: ${LOGIN_LOCK_DURATION:PT10M}
  email-verification:
    code-ttl: ${EMAIL_VERIFICATION_CODE_TTL:PT5M}
    cooldown: ${EMAIL_VERIFICATION_COOLDOWN:PT1M}
    maximum-failed-attempts: ${EMAIL_VERIFICATION_MAXIMUM_FAILED_ATTEMPTS:5}
    hmac-secret: ${EMAIL_VERIFICATION_HMAC_SECRET}
  frontend:
    # 가입·Login·Refresh·Logout API를 직접 호출하는 Frontend 프로세스의 Credential
    username: ${FRONTEND_USERNAME}
    password: ${FRONTEND_PASSWORD}
  learning:
    # 계정 상태·표시 이름을 조회하는 Learning 프로세스의 관계 전용 Credential
    username: ${LEARNING_IDENTITY_USERNAME}
    password: ${LEARNING_IDENTITY_PASSWORD}
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION}
  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL}

email:
  resend:
    api-key: ${RESEND_API_KEY}
    from-email: ${RESEND_FROM_EMAIL}
    connect-timeout: ${RESEND_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${RESEND_READ_TIMEOUT:PT5S}

logging:
  pattern:
    # 개발 환경 텍스트 로그의 Request ID·Trace ID·Span ID 표시 형식
    correlation: "[requestId=%X{http.request.id:-}] [traceId=%X{traceId:-}] [spanId=%X{spanId:-}] "
  structured:
    json:
      # ECS 필드와 중복되는 Micrometer MDC 원본 이름 제외
      exclude:
        - traceId
        - spanId
