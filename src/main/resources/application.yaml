server:
  port: ${SERVER_PORT}

spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: identity_service
    schemas:
      - identity_service
    create-schemas: true
    clean-disabled: true
    validate-on-migrate: true
    postgresql:
      # 비트랜잭션 concurrent index migration을 자체 schema lock으로 막지 않는다.
      transactional-lock: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: identity_service

eureka:
  client:
    enabled: ${EUREKA_ENABLED}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    serviceUrl:
      defaultZone: ${EUREKA_URL}

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never

auth:
  login-protection:
    maximum-failed-attempts: ${LOGIN_MAXIMUM_FAILED_ATTEMPTS}
    lock-duration: ${LOGIN_LOCK_DURATION}
  email-verification:
    code-ttl: ${EMAIL_VERIFICATION_CODE_TTL}
    cooldown: ${EMAIL_VERIFICATION_COOLDOWN}
    maximum-failed-attempts: ${EMAIL_VERIFICATION_MAXIMUM_FAILED_ATTEMPTS}
    hmac-secret: ${EMAIL_VERIFICATION_HMAC_SECRET}
  frontend:
    # 가입·Login·Refresh·Logout API를 직접 호출하는 Frontend 프로세스의 Credential
    username: ${FRONTEND_USERNAME}
    password: ${FRONTEND_PASSWORD}
  learning:
    # 계정 상태·표시 이름을 조회하는 Learning 프로세스의 관계 전용 Credential
    username: ${LEARNING_IDENTITY_USERNAME}
    password: ${LEARNING_IDENTITY_PASSWORD}
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION}
  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL}

email:
  resend:
    api-key: ${RESEND_API_KEY}
    from-email: ${RESEND_FROM_EMAIL}
    connect-timeout: ${RESEND_CONNECT_TIMEOUT}
    read-timeout: ${RESEND_READ_TIMEOUT}
