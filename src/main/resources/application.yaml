server:
  port: ${SERVER_PORT}

spring:
  application:
    name: identity-service
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: identity_service
    schemas:
      - identity_service
    create-schemas: true
    clean-disabled: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: identity_service

eureka:
  client:
    enabled: ${EUREKA_ENABLED}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    serviceUrl:
      defaultZone: ${EUREKA_URL}

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never

auth:
  email-verification:
    code-ttl: ${EMAIL_VERIFICATION_CODE_TTL:PT10M}
    token-ttl: ${EMAIL_VERIFICATION_TOKEN_TTL:PT15M}
    resend-cooldown: ${EMAIL_VERIFICATION_RESEND_COOLDOWN:PT1M}
    maximum-attempts: ${EMAIL_VERIFICATION_MAXIMUM_ATTEMPTS:5}
  login-protection:
    maximum-failed-attempts: ${LOGIN_MAXIMUM_FAILED_ATTEMPTS}
    lock-duration: ${LOGIN_LOCK_DURATION}
  frontend:
    # 가입·Login·Refresh·Logout API를 직접 호출하는 Frontend 프로세스의 Credential
    username: ${FRONTEND_USERNAME}
    password: ${FRONTEND_PASSWORD}
  learning:
    # 계정 상태·표시 이름을 조회하는 Learning 프로세스의 관계 전용 Credential
    username: ${LEARNING_IDENTITY_USERNAME}
    password: ${LEARNING_IDENTITY_PASSWORD}
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION}
  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL}

email:
  resend:
    api-key: ${RESEND_API_KEY}
    from-email: ${RESEND_FROM_EMAIL}
