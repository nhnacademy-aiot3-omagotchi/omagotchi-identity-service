server:
  port: ${SERVER_PORT}

spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: identity_service
    schemas:
      - identity_service
    create-schemas: true
    clean-disabled: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: identity_service

eureka:
  client:
    enabled: ${EUREKA_ENABLED}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    serviceUrl:
      defaultZone: ${EUREKA_URL}

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never

auth:
  frontend:
    # 가입·Login·Refresh·Logout API를 직접 호출하는 Frontend 프로세스의 Credential
    username: ${FRONTEND_USERNAME}
    password: ${FRONTEND_PASSWORD}
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION}
  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL}
