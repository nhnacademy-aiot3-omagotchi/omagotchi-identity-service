spring:
  config:
    # 학교 공유 개발 DB용 필수 .env.dev 구성
    import: "file:./.env.dev[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    # 배포 또는 지정된 담당 절차로 제한된 공유 DB Migration
    enabled: ${FLYWAY_ENABLED:false}

eureka:
  client:
    # 로컬 인스턴스의 운영 Discovery 등록 방지
    enabled: ${EUREKA_ENABLED:false}
