server:
  port: 0

eureka:
  client:
    # Test의 외부 Discovery 연결 방지
    enabled: false
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

auth:
  frontend:
    username: frontend
    password: test-only-frontend-credential-password
  jwt:
    issuer: https://identity.omagotchi.test
    audience: omagotchi-api
    access-token-ttl: PT15M
    public-key-location: classpath:unused-jwt-public.pem
    private-key-location: classpath:unused-jwt-private.pem
  refresh-token:
    ttl: P7D
