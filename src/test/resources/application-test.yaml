server:
  port: 0

eureka:
  client:
    # Test의 외부 Discovery 연결 방지
    enabled: false
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

account:
  recovery:
    policy-effective-at: 2026-09-03T00:00:00Z

auth:
  login-protection:
    maximum-failed-attempts: 5
    lock-duration: PT10M
  email-verification:
    code-ttl: PT5M
    cooldown: PT1M
    maximum-failed-attempts: 5
    hmac-secret: test-only-email-verification-hmac-secret-value
  frontend:
    username: frontend
    password: test-only-frontend-credential-password
  learning:
    username: learning-service
    password: test-only-learning-identity-password
  jwt:
    issuer: https://identity.omagotchi.test
    audience: omagotchi-api
    access-token-ttl: PT15M
    public-key-location: classpath:unused-jwt-public.pem
    private-key-location: classpath:unused-jwt-private.pem
  refresh-token:
    ttl: P7D
email:
  resend:
    api-key: test-only-resend-api-key
    from-email: no-reply@omagotchi.test
    connect-timeout: PT2S
    read-timeout: PT5S
