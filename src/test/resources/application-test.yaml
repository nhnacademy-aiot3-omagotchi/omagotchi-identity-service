server:
  port: 0

eureka:
  client:
    # Test의 외부 Discovery 연결 방지
    enabled: false
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

auth:
  authentication-epoch:
    redis:
      host: localhost
      port: 6379
      database: 0
      username: default
      password: test-only-authentication-epoch-password
      connect-timeout: 1s
      command-timeout: 2s
      ssl-enabled: false
  login-protection:
    maximum-failed-attempts: 5
    lock-duration: PT10M
  frontend:
    username: frontend
    password: test-only-frontend-credential-password
  learning:
    username: learning-service
    password: test-only-learning-identity-password
  jwt:
    issuer: https://identity.omagotchi.test
    audience: omagotchi-api
    access-token-ttl: PT15M
    public-key-location: classpath:unused-jwt-public.pem
    private-key-location: classpath:unused-jwt-private.pem
  refresh-token:
    ttl: P7D
