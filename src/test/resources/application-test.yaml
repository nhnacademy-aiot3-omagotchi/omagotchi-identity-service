server:
  port: 0

spring:
  data:
    redis:
      repositories:
        enabled: false
      host: localhost
      port: 6379
      database: 0
      connect-timeout: 1s
      timeout: 2s

eureka:
  client:
    # Test의 외부 Discovery 연결 방지
    enabled: false
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

auth:
  email-verification:
    code-ttl: PT10M
    token-ttl: PT15M
    resend-cooldown: PT1M
    maximum-attempts: 5
  login-protection:
    maximum-failed-attempts: 5
    lock-duration: PT10M
  frontend:
    username: frontend
    password: test-only-frontend-credential-password
  learning:
    username: learning-service
    password: test-only-learning-identity-password
  jwt:
    issuer: https://identity.omagotchi.test
    audience: omagotchi-api
    access-token-ttl: PT15M
    public-key-location: classpath:unused-jwt-public.pem
    private-key-location: classpath:unused-jwt-private.pem
  refresh-token:
    ttl: P7D

email:
  resend:
    api-key: test-only-resend-api-key
    from-email: Omagotchi <no-reply@example.com>
